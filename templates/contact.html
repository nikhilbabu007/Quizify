{% load static %}

<!DOCTYPE html>
<html>

<head>
 <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quizify/Contact Us</title>


    <link rel="icon" type="image/png" href="{% static 'images/5692030.png' %}">

    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">


<style>

body{
    background:url("{% static 'images/ChatGPT Image Jul 24, 2026, 04_23_12 PM.png' %}") center/cover;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial;
}

.box{

    width:500px;

    background:rgba(255,255,255,.15);

    backdrop-filter:blur(12px);

    padding:35px;

    border-radius:20px;

}

input,textarea{

    width:100%;

    padding:14px;

    margin:10px 0;

    border:none;

    border-radius:8px;

}

textarea{

    height:170px;

    resize:none;

}

button{

    width:100%;

    padding:15px;

    background:#0d6efd;

    color:white;

    border:none;

    border-radius:8px;

    cursor:pointer;

    font-size:18px;

}

.back{

    position:absolute;

    top:20px;

    left:20px;

}

</style>

</head>

<body>

<a href="{% url 'home' %}" class="back">
    Back
</a>

<div class="box">

<h1>Contact Us</h1>

<form method="post">

{% csrf_token %}

<input type="text"
name="name"
placeholder="Your Name"
required>

<input type="email"
name="email"
placeholder="Your Email"
required>

<input type="text"
name="subject"
placeholder="Subject"
required>

<textarea
name="message"
placeholder="Write your message..."
required></textarea>

<button>
Send Message
</button>

</form>

</div>

</body>

</html>
