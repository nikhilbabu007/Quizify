
<!DOCTYPE html>
{% load static %}
<html>
<head>
 <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quizify/Forgot Password</title>


    <link rel="icon" type="image/png" href="{% static 'images/5692030.png' %}">

    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">

<style>


body{

    background:
        linear-gradient(rgba(0,0,0,.35), rgba(0,0,0,.35)),
        url("{% static 'images/img.png' %}");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

}
.box{

    width:420px;
    padding:40px;

    background:rgba(255,255,255,.15);

    backdrop-filter:blur(12px);

    border-radius:20px;

    box-shadow:0 8px 30px rgba(0,0,0,.35);

    text-align:center;

}
input{
width:100%;
padding:12px;
margin:15px 0;
}

button{

    width:100%;
    padding:12px;
    margin-top:10px;

}

.msg{
color:white;
margin-top:20px;
}

.back{
position:absolute;
top:20px;
left:20px;
}

</style>

</head>

<body>

<a href="{% url 'login' %}" class="btn btn-primary back">← Back</a>

<div class="box">

<h2 style="color:white;">Forgot Password</h2>

<form method="POST">

{% csrf_token %}

<input
type="email"
name="email"
placeholder="Enter your registered Email"
required>

<button class="btn btn-success">
Send Reset Link
</button>

</form>

{% if msg %}
<p class="msg">{{msg}}</p>
{% endif %}

</div>

</body>

</html>
