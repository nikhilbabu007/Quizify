<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Quizify | Register</title>

<link rel="icon"
      href="{% static 'images/5692030.png' %}">

<link rel="stylesheet"
      href="{% static 'css/bootstrap.min.css' %}">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{

    min-height:100vh;

    background:
    linear-gradient(rgba(18,30,55,.65),
                    rgba(18,30,55,.65)),
    url("{% static 'images/register-bg.jpg' %}");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    display:flex;
    justify-content:center;
    align-items:center;

    overflow:hidden;

}

/* ===========================
   Back Button
=========================== */

.back-btn{

    position:absolute;

    top:30px;
    left:30px;

    display:flex;
    align-items:center;
    gap:10px;

    text-decoration:none;

    background:white;

    color:#2563eb;

    padding:12px 24px;

    border-radius:50px;

    font-weight:700;

    box-shadow:0 10px 25px rgba(0,0,0,.18);

    transition:.3s;

    z-index:100;

}

.back-btn:hover{

    transform:translateY(-3px);

    color:#2563eb;

}

/* ===========================
   Main Layout
=========================== */

.register-container{

    width:1150px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:80px;

}

/* ===========================
   Illustration
=========================== */

.illustration{

    flex:1;

    text-align:center;

}

.illustration img{

    width:100%;
    max-width:520px;

    animation:float 5s ease-in-out infinite;

}

@keyframes float{

0%{
    transform:translateY(0);
}

50%{
    transform:translateY(-15px);
}

100%{
    transform:translateY(0);
}

}

/* ===========================
   Register Card
=========================== */

.register-card{

    width:460px;

    background:rgba(255,255,255,.16);

    backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,.18);

    border-radius:28px;

    padding:45px;

    box-shadow:0 25px 60px rgba(0,0,0,.25);

}
/* ===========================
   Heading
=========================== */

.register-card h2{

    color:white;

    font-size:38px;

    font-weight:800;

    margin-bottom:8px;

    text-align:center;

}

.register-card p{

    color:rgba(255,255,255,.85);

    text-align:center;

    margin-bottom:30px;

    font-size:16px;

}

/* ===========================
   Input Groups
=========================== */

.input-group{

    display:flex;

    align-items:center;

    background:rgba(255,255,255,.15);

    border:1px solid rgba(255,255,255,.20);

    border-radius:14px;

    margin-bottom:18px;

    overflow:hidden;

    transition:.3s;

}

.input-group:hover{

    border-color:#60a5fa;

    box-shadow:0 0 18px rgba(96,165,250,.35);

}

.input-group:focus-within{

    border-color:#60a5fa;

    box-shadow:0 0 20px rgba(96,165,250,.45);

}

.input-group i{

    color:white;

    font-size:18px;

    padding:0 16px;

}

.input-group input{

    flex:1;

    border:none;

    outline:none;

    background:transparent;

    color:white;

    padding:15px 16px 15px 0;

    font-size:16px;

}

.input-group input::placeholder{

    color:rgba(255,255,255,.75);

}

/* ===========================
   Register Button
=========================== */

.register-btn{

    width:100%;

    border:none;

    border-radius:14px;

    padding:15px;

    margin-top:12px;

    background:linear-gradient(90deg,#2563eb,#3b82f6);

    color:white;

    font-size:18px;

    font-weight:700;

    cursor:pointer;

    transition:.3s;

}

.register-btn:hover{

    transform:translateY(-3px);

    box-shadow:0 12px 30px rgba(37,99,235,.45);

}

/* ===========================
   Login Link
=========================== */

.login-link{

    text-align:center;

    margin-top:22px;

    color:white;

}

.login-link a{

    color:#93c5fd;

    text-decoration:none;

    font-weight:bold;

}

.login-link a:hover{

    text-decoration:underline;

}

/* ===========================
   Error Message
=========================== */

.error{

    margin-top:18px;

    color:#ffd4d4;

    text-align:center;

    font-weight:bold;

}

/* ===========================
   Responsive
=========================== */

@media(max-width:992px){

    .register-container{

        flex-direction:column;

        width:95%;

        gap:40px;

    }

    .illustration img{

        max-width:350px;

    }

    .register-card{

        width:100%;

        max-width:460px;

    }

}

@media(max-width:576px){

    .register-card{

        padding:30px;

    }

    .register-card h2{

        font-size:30px;

    }

    .back-btn{

        top:20px;

        left:20px;

        padding:10px 18px;

    }

}

</style>

</head>
<body>

<!-- Back Button -->

<a href="{% url 'home' %}" class="back-btn">

    <i class="bi bi-arrow-left"></i>

    Back

</a>

<div class="register-container">

    <!-- Left Illustration -->

    <div class="illustration">

        <img
        src="{% static 'images/register-illution.png' %}"
        alt="Register Illustration">

    </div>

    <!-- Register Card -->

    <div class="register-card">

        <h2>Create Account</h2>

        <p>
            Join Quizify and start your learning journey.
        </p>
        {% if error %}

<div class="alert alert-danger text-center">

    {{ error }}

</div>

{% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="input-group">

                <i class="bi bi-person-fill"></i>

                <input
                    type="text"
                    name="name"
                    placeholder="Full Name"
                    required>

            </div>

            <div class="input-group">

                <i class="bi bi-at"></i>

                <input
                    type="text"
                    name="username"
                    placeholder="Username"
                    required>

            </div>

            <div class="input-group">

                <i class="bi bi-envelope-fill"></i>

                <input
                    type="email"
                    name="email"
                    placeholder="Email Address"
                    required>

            </div>

            <div class="input-group">

                <i class="bi bi-telephone-fill"></i>

                <input
                    type="text"
                    name="phno"
                    placeholder="Phone Number"
                    required>

            </div>

            <div class="input-group">

                <i class="bi bi-lock-fill"></i>

                <input
                    type="password"
                    name="password"
                    placeholder="Password"
                    required>

            </div>

            <div class="input-group">

                <i class="bi bi-shield-lock-fill"></i>

                <input
                    type="password"
                    name="confirm_password"
                    placeholder="Confirm Password"
                    required>

            </div>

            <button
                type="submit"
                class="register-btn">

                Create Account

            </button>

        </form>

        {% if msg %}

        <div class="error">

            {{ msg }}

        </div>

        {% endif %}

        <div class="login-link">

            Already have an account?

            <a href="{% url 'login' %}">

                Login

            </a>

        </div>

    </div>

</div>
<script>

window.addEventListener("load", function(){

    const card = document.querySelector(".register-card");

    const illustration = document.querySelector(".illustration");

    card.style.opacity = "0";
    card.style.transform = "translateY(40px)";

    illustration.style.opacity = "0";
    illustration.style.transform = "translateX(-50px)";

    setTimeout(function(){

        card.style.transition = ".8s ease";
        illustration.style.transition = ".8s ease";

        card.style.opacity = "1";
        card.style.transform = "translateY(0)";

        illustration.style.opacity = "1";
        illustration.style.transform = "translateX(0)";

    },200);

});

</script>

</body>

</html>
