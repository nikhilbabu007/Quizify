<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quizify | Verify OTP</title>

    <link rel="icon" type="image/png" href="{% static 'images/5692030.png' %}">

    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{

            height:100vh;

            background:
            linear-gradient(rgba(0,0,0,.45), rgba(0,0,0,.45)),
            url("{% static 'images/ChatGPT Image Jul 24, 2026, 04_23_12 PM.png' %}");

            background-size:cover;
            background-position:center;
            background-repeat:no-repeat;

            display:flex;
            justify-content:center;
            align-items:center;

        }

        .back-btn{

            position:absolute;
            top:25px;
            left:25px;

            text-decoration:none;
            color:white;

            background:#0d6efd;

            padding:10px 22px;

            border-radius:30px;

            font-weight:bold;

            transition:.3s;

        }

        .back-btn:hover{

            background:#0b5ed7;
            color:white;

        }

        .otp-box{

            width:420px;

            padding:40px;

            background:rgba(255,255,255,.15);

            backdrop-filter:blur(10px);

            border-radius:20px;

            box-shadow:0 8px 30px rgba(0,0,0,.35);

            text-align:center;

        }

        .otp-box h1{

            color:white;

            margin-bottom:10px;

            font-size:40px;

            font-weight:bold;

        }

        .otp-box p{

            color:#f1f1f1;

            margin-bottom:25px;

            font-size:16px;

        }

        input{

            width:100%;

            padding:15px;

            border:none;

            outline:none;

            border-radius:10px;

            margin-bottom:20px;

            font-size:17px;

            text-align:center;

            letter-spacing:4px;

        }

        button{

            width:100%;

            padding:14px;

            border:none;

            border-radius:10px;

            background:#0d6efd;

            color:white;

            font-size:18px;

            font-weight:bold;

            cursor:pointer;

            transition:.3s;

        }

        button:hover{

            background:#0b5ed7;

        }

        .error{

            margin-top:20px;

            color:#ffb3b3;

            font-weight:bold;

        }

    </style>

</head>

<body>

<a href="{% url 'login' %}" class="back-btn">
    ← Back
</a>

<div class="otp-box">

    <h1>Verify OTP</h1>

    <p>
        Enter the 6-digit OTP sent to your registered email address.
    </p>

    <form method="post">

        {% csrf_token %}

        <input
                type="text"
                name="otp"
                placeholder="Enter OTP"
                maxlength="6"
                required>

        <button type="submit">
            Verify OTP
        </button>

    </form>

    {% if msg %}
        <div class="error">
            {{ msg }}
        </div>
    {% endif %}

</div>

</body>
</html>
